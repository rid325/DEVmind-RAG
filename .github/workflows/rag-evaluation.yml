name: RAG evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: rag-evaluation
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  baseline-vs-full:
    name: baseline-vs-full
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify frozen CI database
        run: python -m scripts.check_ci_database

      - name: Run held-out baseline versus full evaluation
        id: evaluation
        continue-on-error: true
        run: >-
          python -m scripts.run_pr_evaluation
          --json rag-evaluation.json
          --markdown rag-evaluation.md
          --latency-ceiling-ms 8000

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            rag-evaluation.json
            rag-evaluation.md
          if-no-files-found: error

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devmind-rag-evaluation -->';
            const body = fs.existsSync('rag-evaluation.md')
              ? fs.readFileSync('rag-evaluation.md', 'utf8')
              : `${marker}\n## ❌ RAG evaluation gate\n\nThe workflow stopped before producing a report.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce evaluation gate
        if: always()
        run: |
          if [ "${{ steps.evaluation.outcome }}" != "success" ] || \
             ! jq -e '.comparison.gates.passed == true' rag-evaluation.json >/dev/null 2>&1; then
            echo "RAG evaluation gate failed. See the PR comment and workflow artifact."
            exit 1
          fi
